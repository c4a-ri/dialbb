<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mm_client WebRTC Audio Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h1 {
            margin-top: 0;
            color: #333;
        }
        .session-setup {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="url"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .chat-area {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            height: 300px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            font-family: "Courier New", monospace;
        }
        .message {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
        }
        .message.system {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .message.error {
            background: #ffebee;
            color: #c62828;
        }
        .buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .buttons button {
            flex: 1;
        }
        .info {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            margin-top: 12px;
        }
        .mic-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
        }
        .mic-status {
            font-size: 13px;
            color: #555;
            padding: 4px 8px;
            background: #f0f0f0;
            border-radius: 4px;
            flex: 1;
        }
        #micBtn.active {
            background: #dc3545;
        }
        #micBtn.active:hover {
            background: #a71d2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>mm_client WebRTC Audio Client</h1>
        <p>制御は WebSocket、音声は WebRTC でやり取りするデモ</p>
        
        <div class="session-setup">
            <input type="text" id="sessionId" placeholder="Session ID (or auto-create)" value="">
            <input type="url" id="serverUrl" placeholder="ws://localhost:5000" value="ws://localhost:5000">
            <button id="createBtn" onclick="createSession()">作成</button>
            <button id="connectBtn" onclick="connect()" disabled>接続</button>
        </div>
        
        <div id="status" class="status disconnected">状態: 未接続</div>
        
        <div class="chat-area" id="chatArea"></div>
        
        <div class="buttons">
            <button id="startBtn" onclick="startDialogue()" disabled>対話開始</button>
            <button id="endBtn" onclick="endDialogue()" disabled>対話終了</button>
            <button id="closeBtn" onclick="closeConnection()" disabled>切断</button>
        </div>

        <div class="mic-controls">
            <button id="micBtn" onclick="toggleMic()" disabled>🎤 マイク開始</button>
            <span class="mic-status" id="micStatus">マイク 停止中</span>
        </div>

        <!-- ローカル環境の音声ファイルを選択して、sendAudioFile()へ渡す -->
        <div class="buttons">
            <input type="file" id="audioFileInput" accept="audio/*">
            <button id="sendAudioFileBtn" onclick="sendAudioFile()" disabled>音声ファイル送信 (未対応)</button>
        </div>

        <div class="info">
            <strong>使用方法:</strong><br>
            1. 「作成」でセッション ID を生成するか、既存の ID を入力<br>
            2. 「接続」で制御用 WebSocket と音声用 WebRTC に接続<br>
            3. 「対話開始」で会話を開始<br>
            4. 「マイク開始」で音声を送信し、サーバからの音声応答を再生
        </div>
    </div>

    <script>
        let socket = null;
        let sessionId = '';
        let peerConnection = null;
        let micSender = null;
        let micStream = null;
        let micActive = false;
        let remoteAudioElement = null;

        function normalizeServerUrl(rawUrl) {
            const input = (rawUrl || '').trim();
            if (!input) {
                return new URL('http://localhost:5000');
            }
            if (/^[a-zA-Z][a-zA-Z\d+.-]*:\/\//.test(input)) {
                return new URL(input);
            }
            return new URL(`http://${input}`);
        }

        function toHttpBaseUrl(rawUrl) {
            const url = normalizeServerUrl(rawUrl);
            if (url.protocol === 'ws:') {
                url.protocol = 'http:';
            } else if (url.protocol === 'wss:') {
                url.protocol = 'https:';
            }
            return url.origin;
        }

        function toWsBaseUrl(rawUrl) {
            const url = normalizeServerUrl(rawUrl);
            if (url.protocol === 'http:') {
                url.protocol = 'ws:';
            } else if (url.protocol === 'https:') {
                url.protocol = 'wss:';
            }
            return url.origin;
        }

        function log(message, type = 'system') {
            const chatArea = document.getElementById('chatArea');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function updateStatus(connected) {
            const status = document.getElementById('status');
            if (connected) {
                status.className = 'status connected';
                status.textContent = `✓ 接続済み (Session: ${sessionId})`;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('closeBtn').disabled = false;
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('micBtn').disabled = false;
                document.getElementById('sendAudioFileBtn').disabled = true;
            } else {
                status.className = 'status disconnected';
                status.textContent = '✗ 未接続';
                document.getElementById('startBtn').disabled = true;
                document.getElementById('endBtn').disabled = true;
                document.getElementById('closeBtn').disabled = true;
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('micBtn').disabled = true;
                document.getElementById('sendAudioFileBtn').disabled = true;
                stopMic();
                closeWebRtc();
            }
        }

        function ensureRemoteAudioElement() {
            if (!remoteAudioElement) {
                remoteAudioElement = document.createElement('audio');
                remoteAudioElement.autoplay = true;
                remoteAudioElement.playsInline = true;
                remoteAudioElement.hidden = true;
                document.body.appendChild(remoteAudioElement);
            }
            return remoteAudioElement;
        }

        function waitForIceGatheringComplete(pc) {
            if (pc.iceGatheringState === 'complete') {
                return Promise.resolve();
            }
            return new Promise((resolve) => {
                const handleStateChange = () => {
                    if (pc.iceGatheringState === 'complete') {
                        pc.removeEventListener('icegatheringstatechange', handleStateChange);
                        resolve();
                    }
                };
                pc.addEventListener('icegatheringstatechange', handleStateChange);
            });
        }

        async function connectWebRtc() {
            const serverUrl = document.getElementById('serverUrl').value;
            const httpBaseUrl = toHttpBaseUrl(serverUrl);
            await closeWebRtc();

            peerConnection = new RTCPeerConnection();
            const transceiver = peerConnection.addTransceiver('audio', { direction: 'sendrecv' });
            micSender = transceiver.sender;

            peerConnection.ontrack = (event) => {
                const audioEl = ensureRemoteAudioElement();
                audioEl.srcObject = event.streams[0] || new MediaStream([event.track]);
                void audioEl.play().catch((error) => {
                    log(`⚠️ Remote audio play failed: ${error.message}`, 'error');
                });
                log('✓ WebRTC audio track connected');
            };

            peerConnection.onconnectionstatechange = () => {
                log(`WebRTC state: ${peerConnection.connectionState}`);
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            await waitForIceGatheringComplete(peerConnection);

            const response = await fetch(`${httpBaseUrl}/sessions/${sessionId}/webrtc/offer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sdp: peerConnection.localDescription.sdp,
                    type: peerConnection.localDescription.type,
                }),
            });

            if (!response.ok) {
                throw new Error(`WebRTC offer failed: ${response.status}`);
            }

            const answer = await response.json();
            await peerConnection.setRemoteDescription(answer);
            log('✓ WebRTC connected');
        }

        async function closeWebRtc() {
            if (micSender) {
                try {
                    await micSender.replaceTrack(null);
                } catch (error) {
                    log(`⚠️ Failed to detach mic track: ${error.message}`, 'error');
                }
                micSender = null;
            }

            if (peerConnection) {
                peerConnection.ontrack = null;
                peerConnection.onconnectionstatechange = null;
                peerConnection.close();
                peerConnection = null;
            }

            if (remoteAudioElement) {
                remoteAudioElement.srcObject = null;
            }
        }

        async function createSession() {
            const serverUrl = document.getElementById('serverUrl').value;
            const httpBaseUrl = toHttpBaseUrl(serverUrl);
            try {
                const resp = await fetch(`${httpBaseUrl}/sessions`, { method: 'POST' });
                const data = await resp.json();
                sessionId = data.session_id;
                document.getElementById('sessionId').value = sessionId;
                document.getElementById('connectBtn').disabled = false;
                log(`✓ Session created: ${sessionId}`);
            } catch (error) {
                log(`✗ Failed to create session: ${error.message}`, 'error');
            }
        }

        function connect() {
            sessionId = document.getElementById('sessionId').value.trim();
            if (!sessionId) {
                log('✗ Session ID is required', 'error');
                return;
            }

            const serverUrl = document.getElementById('serverUrl').value;
            const wsBaseUrl = toWsBaseUrl(serverUrl);
            const wsUrl = `${wsBaseUrl}/dialogue/ws/${sessionId}`;

            log(`Connecting to ${wsUrl}...`);
            document.getElementById('status').className = 'status connecting';
            document.getElementById('status').textContent = '⏳ 接続中...';

            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                log('✓ WebSocket connected');
                updateStatus(true);
                void connectWebRtc().catch((error) => {
                    log(`✗ WebRTC connection failed: ${error.message}`, 'error');
                });
            };

            socket.onmessage = (event) => {
                const message = JSON.parse(event.data);

                if (message.event === 'joined_session') {
                    log(`✓ Joined session: ${message.payload.session_id}`);
                } else if (message.event === 'error') {
                    log(`✗ Error: ${message.payload.message}`, 'error');
                } else {
                    log(`Event: ${message.event}`, 'system');
                }
            };

            socket.onerror = (error) => {
                log(`✗ WebSocket error: ${error}`, 'error');
                updateStatus(false);
            };

            socket.onclose = () => {
                log('✗ WebSocket closed');
                updateStatus(false);
                socket = null;
            };
        }

        function startDialogue() {
            if (!socket) return;
            socket.send(JSON.stringify({ action: 'start_dialogue' }));
            log('Dialogue started');
            document.getElementById('endBtn').disabled = false;
        }

        function endDialogue() {
            if (!socket) return;
            socket.send(JSON.stringify({ action: 'end_dialogue' }));
            log('Dialogue ended');
            document.getElementById('endBtn').disabled = true;
        }

        function closeConnection() {
            stopMic();
            void closeWebRtc();
            if (socket) {
                socket.close();
            }
        }

        function sendAudioFile() {
            log('⚠️ 音声ファイル送信は WebRTC 音声モードでは未対応です', 'error');
        }

        function setMicStatus(text) {
            const st = document.getElementById('micStatus');
            if (st) st.textContent = text;
        }

        async function toggleMic() {
            log(`🎤 マイクボタン押下 (active=${micActive})`);
            if (micActive) {
                stopMic();
            } else {
                await startMic();
            }
        }

        async function startMic() {
            try {
                setMicStatus('マイク 起動中...');
                if (!socket || socket.readyState !== WebSocket.OPEN || !peerConnection || !micSender) {
                    setMicStatus('マイク開始失敗: 接続未完了');
                    log('✗ WebSocket または WebRTC 未接続のためマイクを開始できません', 'error');
                    return;
                }
                if (document.getElementById('endBtn').disabled) {
                    startDialogue();
                    log('ℹ️ マイク開始に合わせて対話を開始しました');
                }

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('このブラウザ/配信元では getUserMedia が利用できません（https または localhost で開いてください）');
                }

                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
                });
                const [track] = micStream.getAudioTracks();
                await micSender.replaceTrack(track || null);
                micActive = true;
                document.getElementById('micBtn').textContent = '🎤 マイク停止';
                document.getElementById('micBtn').classList.add('active');
                setMicStatus('⚫ 録音中...');
                log('🎤 マイク入力開始 (WebRTC)');
            } catch (err) {
                setMicStatus(`マイク開始失敗: ${err.message}`);
                log(`✗ マイクエラー: ${err.message}`, 'error');
            }
        }

        function stopMic() {
            if (micSender) {
                void micSender.replaceTrack(null);
            }
            if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
            micActive = false;
            const btn = document.getElementById('micBtn');
            if (btn) {
                btn.textContent = '🎤 マイク開始';
                btn.classList.remove('active');
            }
            setMicStatus('マイク 停止中');
            log('🎤 マイク入力停止');
        }
    </script>
</body>
</html>
