<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DialBB No-Code Tool Documents</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f7f4ed;
			--panel: #fffdf8;
			--text: #1f2933;
			--muted: #52606d;
			--line: #d9d0c3;
			--accent: #0f766e;
			--accent-hover: #115e59;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background:
				radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 32%),
				linear-gradient(180deg, #f8f5ef 0%, #f2ede3 100%);
			color: var(--text);
			font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
		}

		main {
			width: min(720px, 100%);
			padding: 40px 32px;
			border: 1px solid var(--line);
			border-radius: 20px;
			background: var(--panel);
			box-shadow: 0 20px 50px rgba(31, 41, 51, 0.08);
		}

		h1 {
			margin: 0 0 12px;
			font-size: clamp(2rem, 4vw, 2.6rem);
			line-height: 1.2;
		}

		p {
			margin: 0;
			line-height: 1.7;
			color: var(--muted);
			font-size: 1rem;
		}

		.links {
			margin-top: 28px;
			display: grid;
			gap: 14px;
		}

		.link-card {
			display: block;
			padding: 18px 20px;
			border: 1px solid var(--line);
			border-radius: 14px;
			background: #ffffff;
			color: var(--text);
			text-decoration: none;
			transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
		}

		.link-card:hover {
			transform: translateY(-1px);
			border-color: var(--accent);
			box-shadow: 0 10px 24px rgba(15, 118, 110, 0.12);
		}

		.link-title {
			display: block;
			margin-bottom: 4px;
			color: var(--accent);
			font-size: 1.05rem;
			font-weight: 700;
		}

		.link-desc {
			display: block;
			color: var(--muted);
			font-size: 0.95rem;
		}
	</style>
</head>
<body>
	<main>
		<h1>DialBB-NC Documentation</h1>
		<p>閲覧する言語を選択してください。日本語版は HTML、英語版は Markdown です。</p>

		<div class="links">
			<a class="link-card" href="index-ja.html">
				<span class="link-title">日本語版はこちら</span>
				<span class="link-desc">DialBB-NC ドキュメントの日本語ページを開きます。</span>
			</a>

			<a class="link-card" href="index-en.html">
				<span class="link-title">英語版はこちら</span>
				<span class="link-desc">DialBB-NC documentation in English.</span>
			</a>
		</div>
	</main>
</body>
</html>
